{{- include "generic-kargo-pipeline.validateValues" . -}}
{{- $stage := .Values.pipeline.stages.dev -}}
{{- $components := include "generic-kargo-pipeline.components" . | fromYamlArray -}}
{{- $repo := .Values.sources.chartGit.repository.url -}}
{{- $revision := include "generic-kargo-pipeline.kargoExpression" "freightMetadata(ctx.targetFreight.name)['release-commit']" -}}
{{- $definitions := dict -}}{{- range .Values.analysisTemplates }}{{- $_ := set $definitions .name . -}}{{- end -}}
{{- $hasSmooth := false -}}{{- range $reference := $stage.verification.analysisTemplates }}{{- $definition := get $definitions $reference.name }}{{- if and $reference.enabled $definition (eq $definition.type "smooth") }}{{- $hasSmooth = true }}{{- end }}{{- end -}}
{{- $hasExternal := false -}}{{- range $reference := $stage.verification.analysisTemplates }}{{- $definition := get $definitions $reference.name }}{{- if and $reference.enabled $definition (eq $definition.type "external") }}{{- $hasExternal = true }}{{- end }}{{- end -}}
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: {{ include "generic-kargo-pipeline.normalizeName" $stage.name | quote }}
  labels:
    {{- include "generic-kargo-pipeline.labels" . | nindent 4 }}
    {{- include "generic-kargo-pipeline.applicationLabels" . | nindent 4 }}
spec:
  requestedFreight:
    - origin: { kind: Warehouse, name: {{ include "generic-kargo-pipeline.normalizeName" .Values.warehouse.name | quote }} }
      sources:
        stages: [{{ include "generic-kargo-pipeline.normalizeName" .Values.pipeline.stages.prepareRelease.name | quote }}]
        autoPromotionOptions:
          selectionPolicy: {{ $stage.freightSelectionPolicy | quote }}
  promotionTemplate:
    spec:
      steps:
{{ include "generic-kargo-pipeline.tagPolicySteps" (dict "stageKey" "dev" "stage" $stage "components" $components) | nindent 8 }}
        - uses: argocd-update
          as: deploy-exact-release
          config:
            apps:
              - name: {{ $stage.argocd.applicationName | quote }}
                sources:
                  - repoURL: {{ $repo | quote }}
                    desiredRevision: {{ $revision | quote }}
                    updateTargetRevision: true
{{ include "generic-kargo-pipeline.outcomeEmailSteps" (dict "root" . "stageKey" "dev" "stage" $stage "includeSuccess" false) | nindent 8 }}
  {{- if and $stage.verification.enabled $stage.verification.analysisTemplates }}
  verification:
    analysisTemplates:
      {{- range $stage.verification.analysisTemplates }}{{- $definition := get $definitions .name }}{{- if and .enabled (ne $definition.type "smooth") (ne $definition.type "external") }}
      - name: {{ default .name $definition.resourceName | quote }}
        {{- if eq $definition.type "external" }}
        kind: {{ default $definition.kind .kind | quote }}
        {{- else }}{{- with .kind }}
        kind: {{ . | quote }}
        {{- end }}{{- end }}
      {{- end }}{{- end }}
      {{- if $hasSmooth }}
      - name: {{ printf "%s-dev-dispatcher" (include "generic-kargo-pipeline.fullname" .) | include "generic-kargo-pipeline.normalizeName" | quote }}
      {{- end }}
      {{- if $hasExternal }}
      - name: {{ printf "%s-dev-external-dispatcher" (include "generic-kargo-pipeline.fullname" .) | include "generic-kargo-pipeline.normalizeName" | quote }}
      {{- end }}
    args:
      - { name: freightName, value: {{ include "generic-kargo-pipeline.kargoExpression" "ctx.targetFreight.name" | quote }} }
      - { name: releaseCommit, value: {{ $revision | quote }} }
      - { name: changedComponents, value: {{ include "generic-kargo-pipeline.kargoExpression" "freightMetadata(ctx.targetFreight.name)['changed-components']" | quote }} }
      - { name: runForChangedComponentsOnly, value: {{ $stage.verification.runForChangedComponentsOnly | quote }} }
      - { name: parallelismLimit, value: {{ $stage.verification.parallelismLimit | quote }} }
{{ include "generic-kargo-pipeline.externalStageArgs" (dict "definitions" $definitions "references" $stage.verification.analysisTemplates) | nindent 6 }}
  {{- end }}
