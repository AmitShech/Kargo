{{- include "generic-kargo-pipeline.validateValues" . -}}
{{- $stage := .Values.pipeline.stages.prepareRelease -}}
{{- $builtInComponentDefaults := include "generic-kargo-pipeline.componentDefaults" . | fromYaml -}}
{{- $componentDefaults := mergeOverwrite (deepCopy $builtInComponentDefaults) (default dict .Values.sources.componentDefaults) -}}
{{- $enabledComponents := list -}}
{{- $deploymentCommitExpression := include "generic-kargo-pipeline.kargoExpression" "commitFrom(vars.chartRepo).ID" -}}
{{- $targetBranchExpression := include "generic-kargo-pipeline.kargoExpression" "vars.targetBranch" -}}
{{- $targetFreightNameExpression := include "generic-kargo-pipeline.kargoExpression" "ctx.targetFreight.name" -}}
{{- $committedRevisionExpression := include "generic-kargo-pipeline.kargoExpression" "outputs.commit.commit" -}}
{{- range .Values.sources.components -}}
{{- $component := mergeOverwrite (deepCopy $componentDefaults) . -}}
{{- if $component.enabled -}}
{{- $enabledComponents = append $enabledComponents $component -}}
{{- end -}}
{{- end }}
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: {{ include "generic-kargo-pipeline.normalizeName" .Values.pipeline.stages.prepareRelease.name | quote }}
  labels:
    {{- include "generic-kargo-pipeline.labels" . | nindent 4 }}
    {{- include "generic-kargo-pipeline.applicationLabels" . | nindent 4 }}
  {{- with .Values.global.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: {{ include "generic-kargo-pipeline.normalizeName" .Values.warehouse.name | quote }}
      sources:
        direct: true
        autoPromotionOptions:
          selectionPolicy: {{ .Values.pipeline.stages.prepareRelease.freightSelectionPolicy | quote }}
  promotionTemplate:
    spec:
      vars:
        - name: chartRepo
          value: {{ .Values.sources.chartGit.repository.url | quote }}
        - name: targetBranch
          value: {{ .Values.pipeline.stages.prepareRelease.releaseBranch | quote }}
      steps:
{{ include "generic-kargo-pipeline.tagPolicySteps" (dict "stageKey" "prepare-release" "stage" .Values.pipeline.stages.prepareRelease "components" $enabledComponents) | nindent 8 }}
        - uses: git-clone
          as: clone-deployment
          config:
            repoURL: {{ .Values.sources.chartGit.repository.url | quote }}
            checkout:
              - commit: {{ $deploymentCommitExpression | quote }}
                as: chart-input
                path: ./source
              - branch: {{ $targetBranchExpression | quote }}
                as: release-branch
                create: true
                path: ./release

{{- range $enabledComponents }}
{{- $componentName := include "generic-kargo-pipeline.normalizeName" .name }}
{{- $outputPath := replace "name" $componentName .releaseConfiguration.outputPath }}
        - uses: yaml-parse
          as: {{ printf "inspect-%s" $componentName | quote }}
          config:
            path: {{ print "./source/" $outputPath | quote }}
            outputs:
              - name: existingTag
                fromExpression: {{ .valuesMapping.tagPath | quote }}
{{- end }}
        - uses: git-clear
          as: clear-release
          config:
            path: ./release

        - uses: copy
          as: copy-deployment-source
          config:
            inPath: ./source
            outPath: ./release

{{- range $enabledComponents }}
{{- $componentName := include "generic-kargo-pipeline.normalizeName" .name }}
{{- $devConfigurationPath := replace "name" $componentName .releaseConfiguration.devConfigurationPath }}
{{- $chartOverlayPath := replace "name" $componentName .releaseConfiguration.chartOverlayPath }}
{{- $outputPath := replace "name" $componentName .releaseConfiguration.outputPath }}
{{- $imageTagExpression := include "generic-kargo-pipeline.kargoExpression" (printf "imageFrom(%q).Tag" .image.repository) }}
        - uses: git-clone
          as: {{ print "clone-" $componentName "-config" | quote }}
          config:
            repoURL: {{ .developerGit.repository.url | quote }}
            checkout:
              - tag: {{ $imageTagExpression | squote }}
                as: {{ $componentName | quote }}
                path: {{ print "./config/" $componentName | quote }}
{{- if .releaseConfiguration.generationEnabled }}
        - uses: yaml-merge
          as: {{ print "merge-" $componentName "-config" | quote }}
          config:
            inFiles:
              - {{ print "./config/" $componentName "/" $devConfigurationPath | quote }}
              - {{ print "./release/" $chartOverlayPath | quote }}
            outFile: {{ print "./release/" $outputPath | quote }}
{{- end }}
{{- $outputPath := replace "name" $componentName .releaseConfiguration.outputPath }}
{{- $imageTagValueExpression := include "generic-kargo-pipeline.kargoExpression" (printf "imageFrom(%q).Tag" .image.repository) }}
        - uses: yaml-update
          as: {{ print "update-" $componentName "-image" | quote }}
          config:
            path: {{ print "./release/" $outputPath | quote }}
            updates:
              - key: {{ .valuesMapping.tagPath | quote }}
                value: {{ $imageTagValueExpression | squote }}
{{- end }}

        - uses: git-commit
          as: commit
          config:
            path: ./release
            message: "prepare release according to freight data"

        - uses: git-push
          as: push-release
          config:
            path: ./release
            targetBranch: {{ $targetBranchExpression | quote }}

        - uses: set-metadata
          config:
            updates:
              - kind: Freight
                name: {{ $targetFreightNameExpression | quote }}
                values:
                  chart-input-commit: {{ $deploymentCommitExpression | quote }}
                  release-branch: {{ $targetBranchExpression | quote }}
                  release-commit: {{ $committedRevisionExpression | quote }}
                  deploy-from-commit: {{ $committedRevisionExpression | quote }}
                  changed-components:
{{- range $enabledComponents }}
{{- $componentName := include "generic-kargo-pipeline.normalizeName" .name }}
                    {{ $componentName }}: {{ include "generic-kargo-pipeline.kargoExpression" (printf "outputs['inspect-%s'].existingTag != imageFrom(%q).Tag" $componentName .image.repository) | quote }}
{{- end }}
                  component-evidence:
{{- range $enabledComponents }}
{{- $componentName := include "generic-kargo-pipeline.normalizeName" .name }}
                    {{ $componentName }}:
                      imageTag: {{ include "generic-kargo-pipeline.kargoExpression" (printf "imageFrom(%q).Tag" .image.repository) | quote }}
                      imageDigest: {{ include "generic-kargo-pipeline.kargoExpression" (printf "imageFrom(%q).Digest" .image.repository) | quote }}
                      developerGitTag: {{ include "generic-kargo-pipeline.kargoExpression" (printf "imageFrom(%q).Tag" .image.repository) | quote }}
                      developerGitCommit: {{ include "generic-kargo-pipeline.kargoExpression" (printf "outputs['clone-%s-config'].commits[%q]" $componentName $componentName) | quote }}
                      previousTag: {{ include "generic-kargo-pipeline.kargoExpression" (printf "outputs['inspect-%s'].existingTag" $componentName) | quote }}
{{- end }}
{{ include "generic-kargo-pipeline.outcomeEmailSteps" (dict "root" . "stageKey" "prepare-release" "stage" $stage "includeSuccess" true) | nindent 8 }}
