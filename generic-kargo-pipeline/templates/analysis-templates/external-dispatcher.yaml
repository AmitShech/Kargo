{{- $definitions := dict -}}{{- range .Values.analysisTemplates -}}{{- $_ := set $definitions .name . -}}{{- end -}}
{{- $components := include "generic-kargo-pipeline.components" . | fromYamlArray -}}
{{- range $stageKey := list "dev" "integration" -}}{{- $stage := get $.Values.pipeline.stages $stageKey -}}{{- $active := list -}}
{{- range $reference := $stage.verification.analysisTemplates -}}{{- $definition := get $definitions $reference.name -}}{{- if and $reference.enabled $definition (eq $definition.type "external") -}}{{- $active = append $active (dict "reference" $reference "definition" $definition) -}}{{- end -}}{{- end -}}
{{- if and $stage.verification.enabled $active }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ printf "%s-%s-external-dispatcher" (include "generic-kargo-pipeline.fullname" $) $stageKey | include "generic-kargo-pipeline.normalizeName" | quote }}
  labels: {{- include "generic-kargo-pipeline.labels" $ | nindent 4 }}
    {{- include "generic-kargo-pipeline.applicationLabels" $ | nindent 4 }}
spec:
  args:
    - { name: freightName, value: "" }
    - { name: releaseCommit, value: "" }
{{ include "generic-kargo-pipeline.externalStageArgs" (dict "definitions" $definitions "references" $stage.verification.analysisTemplates) | nindent 4 }}
  metrics:
    - name: dispatch-external
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                serviceAccountName: {{ printf "%s-dispatcher" (include "generic-kargo-pipeline.fullname" $) | include "generic-kargo-pipeline.normalizeName" | quote }}
                restartPolicy: Never
                containers:
                  - name: dispatcher
                    image: {{ printf "%s:%s" $.Values.global.dispatcher.image.repository $.Values.global.dispatcher.image.tag | quote }}
                    imagePullPolicy: {{ $.Values.global.dispatcher.image.pullPolicy | quote }}
                    env:
                      - name: DISPATCHER_CONFIG
                        {{- $entries := list -}}{{- range $item := $active -}}{{- $reference := $item.reference -}}{{- $definition := $item.definition -}}{{- $overrides := default dict $reference.overrides -}}
                        {{- $arguments := dict "freightName" "{{ args.freightName }}" "releaseCommit" "{{ args.releaseCommit }}" -}}{{- range $argument := default list $definition.arguments -}}{{- if hasKey $argument "default" -}}{{- $_ := set $arguments $argument.name $argument.default -}}{{- end -}}{{- end -}}{{- range $argument := default list $reference.arguments -}}{{- $_ := set $arguments $argument.name $argument.value -}}{{- end -}}
                        {{- $retryAmount := $definition.retryAmount -}}{{- if hasKey $overrides "retryAmount" -}}{{- $retryAmount = $overrides.retryAmount -}}{{- end -}}
                        {{- $timeout := $definition.timeout -}}{{- if hasKey $overrides "timeout" -}}{{- $timeout = $overrides.timeout -}}{{- end -}}
                        {{- $ttlAfterFinished := $definition.ttlAfterFinished -}}{{- if hasKey $overrides "ttlAfterFinished" -}}{{- $ttlAfterFinished = $overrides.ttlAfterFinished -}}{{- end -}}
                        {{- $mode := $definition.mode -}}{{- if hasKey $overrides "mode" -}}{{- $mode = $overrides.mode -}}{{- end -}}
                        {{- $allowedFailedMeasurements := 0 -}}{{- if hasKey $definition "allowedFailedMeasurements" -}}{{- $allowedFailedMeasurements = $definition.allowedFailedMeasurements -}}{{- end -}}{{- if hasKey $overrides "allowedFailedMeasurements" -}}{{- $allowedFailedMeasurements = $overrides.allowedFailedMeasurements -}}{{- end -}}
                        {{- $base := dict "name" $definition.name "resourceName" (default $definition.name $definition.resourceName) "kind" (default $definition.kind $reference.kind) "target" $definition.target "arguments" $arguments "retryAmount" $retryAmount "timeout" $timeout "ttlAfterFinished" $ttlAfterFinished "mode" $mode "allowedFailedMeasurements" $allowedFailedMeasurements -}}
                        {{- if eq $definition.target "components" -}}{{- range $component := $components -}}{{- if $component.enabled -}}{{- $entry := deepCopy $base -}}{{- $_ := set $entry "component" $component.name -}}{{- $_ := set $entry "name" (printf "%s-%s" $definition.name $component.name) -}}{{- $entries = append $entries $entry -}}{{- end -}}{{- end -}}{{- else -}}{{- $entries = append $entries $base -}}{{- end -}}{{- end }}
                        value: {{ toJson (dict "parentName" (printf "{{ args.freightName }}-%s-external" $stageKey) "templates" $entries) | quote }}
{{ end }}{{ end }}
