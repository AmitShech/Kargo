# Generic Kargo pipeline defaults. Application-specific values belong in an override file.
global:
  system:
    name: my-system
    displayName: My System
    owner: application-team
  labels: {}
  annotations: {}
  dispatcher:
    image:
      # External prerequisite: this chart renders dispatcher Jobs but does not
      # build, publish, or install the dispatcher implementation.
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent

warehouse:
  name: app-images
  interval: 10m
  freightCreationPolicy: Automatic

sources:
  componentDefaults:
    enabled: true
    tagPolicy:
      allowedPatterns: []
      deniedPatterns: []
  components:
    - name: main
      enabled: true
      image:
        repository: registry.example.com/team/my-app
        selectionStrategy: NewestBuild
        allowedTags: ""
        semverConstraint: ""
        strictSemvers: false
        discoveryLimit: 20
      developerGit:
        repository:
          url: https://gitlab.example.com/team/my-app.git
          username: ""
          password: ""
      qaGit:
        repository:
          url: https://gitlab.example.com/team/my-app-qa.git
          username: ""
          password: ""
        branch: main
        path: .
      releaseConfiguration:
        generationEnabled: true
        devConfigurationPath: src/main/resources/Main/dev-configuration.yaml
        chartOverlayPath: configurations/components/name/kargo/config.yaml
        outputPath: configurations/components/name/base/config.yaml
      valuesMapping:
        tagPath: image.tag
      tagPolicy:
        allowedPatterns: []
        deniedPatterns: []
      verification:
        labels: {}
        filters: {}
  chartGit:
    repository:
      url: https://gitlab.example.com/team/my-app-deployment.git
      username: ""
      password: ""
    branches:
      source: develop
      production: master
    subscription:
      enabled: true
      commitSelectionStrategy: NewestFromBranch
      discoveryLimit: 15
      includePaths: [values.yaml, values/**]
      excludePaths: [kargo/**, release-metadata/**]

pipeline:
  notifications:
    email:
      recipients: []
      defaults:
        success: { subject: "", body: "" }
        failure: { subject: "", body: "" }
  stages:
    prepareRelease:
      name: prepare-release
      autoPromotionEnabled: true
      freightSelectionPolicy: NewestFreight
      releaseBranch: release/${{ ctx.targetFreight.name }}
      tagPolicy: { allowedPatterns: [], deniedPatterns: [] }
      outcomes: {}
    dev:
      name: dev
      autoPromotionEnabled: true
      freightSelectionPolicy: MatchUpstream
      argocd: { applicationName: my-app-dev }
      tagPolicy: { allowedPatterns: [], deniedPatterns: [] }
      verification:
        enabled: false
        mode: blocking
        parallelismLimit: 2
        runForChangedComponentsOnly: true
        analysisTemplates: []
      outcomes: {}
    integration:
      name: integration
      autoPromotionEnabled: true
      freightSelectionPolicy: MatchUpstream
      argocd: { applicationName: my-app-integration }
      tagPolicy: { allowedPatterns: [], deniedPatterns: [] }
      verification:
        enabled: false
        mode: blocking
        initialDelay: 0s
        duration: 10m
        interval: 1m
        maxMeasurements: 1000
        allowedFailedMeasurements: 0
        dryRunAll: false
        analysisTemplates: []
      outcomes: {}
    preProduction:
      name: pre-production
      autoPromotionEnabled: true
      freightSelectionPolicy: MatchUpstream
      tagPolicy:
        allowedPatterns: ['^v?[0-9]+\.[0-9]+\.[0-9]+$']
        deniedPatterns: ['^dev-', '-rc', '-snapshot']
      ai:
        enabled: false
        schedule:
          timezone: Asia/Jerusalem
          workingDaysAhead: 3
          startTime: "13:00"
          durationMinutes: 15
          excludedWeekdays: [Friday, Saturday]
          holidays: []
        requiredFields: [title, description, reason, impact, startTime, endTime]
        prompt: "Return JSON only and populate every required field from the supplied release evidence."
      serviceNow: { enabled: false, fixedFields: {}, aiFieldMapping: {} }
      gitLab:
        enabled: false
        projectPath: ""
        fixedFields:
          title: ""
          description: ""
        mergeRequest:
          squash: false
          removeSourceBranchWhenMerged: true
          requireCommitPreservingMerge: true
      outcomes: {}
    production:
      name: production
      autoPromotionEnabled: false
      freightSelectionPolicy: MatchUpstream
      argocd: { applicationName: my-app-production }
      tagPolicy:
        allowedPatterns: ['^v?[0-9]+\.[0-9]+\.[0-9]+$']
        deniedPatterns: ['^dev-', '-rc', '-snapshot']
      verification:
        enabled: false
        mode: blocking
        analysisTemplates: []
      outcomes:
        success:
          notifications: { email: { enabled: false, subject: "", body: "" } }
          serviceNow: { enabled: false, fields: {} }
        failure:
          notifications: { email: { enabled: false, subject: "", body: "" } }
          serviceNow: { enabled: false, fields: {} }
          monitoring: { enabled: false, payload: {} }

services:
  prometheus: { endpoint: "", allowInsecureHttp: false, labels: {}, authentication: { type: none } }
  elasticsearch: { endpoint: "", allowInsecureHttp: false, index: "", timeField: "@timestamp", filters: {}, authentication: { type: none } }
  ai: { endpoint: "", allowInsecureHttp: false, authentication: { type: none } }
  serviceNow: { endpoint: "", allowInsecureHttp: false, authentication: { type: none } }
  gitLab: { endpoint: "", allowInsecureHttp: false, authentication: { type: none } }
  mail: { endpoint: "", allowInsecureHttp: false, authentication: { type: none } }
  monitoring: { endpoint: "", allowInsecureHttp: false, authentication: { type: none } }

analysisTemplates: []
